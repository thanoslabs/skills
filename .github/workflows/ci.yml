name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if env files or key files are tracked (.env.example is allowed)
          files=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$|\.(pem|p12|pfx)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' | grep -vE '\.env\.(example|sample|template)$' || true)
          # Fail if a tracked file contains a private key block or an AWS access key ID
          content=$(git grep -lE --cached -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' || true)
          if [ -n "$files$content" ]; then
            echo "Error: sensitive files or credentials committed:"
            printf '%s\n' $files $content
            exit 1
          fi

      - name: Validate YAML files
        run: |
          python3 -c "import yaml"
          failed=0
          for f in $(git ls-files '*.yaml' '*.yml'); do
            if ! python3 -c "import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"; then
              echo "Invalid YAML: $f"
              failed=1
            fi
          done
          exit $failed

      # Add project-specific validation steps below, e.g.:
      # - name: Run tests
      #   run: go test ./...
      #
      # - name: Build Docker image
      #   run: docker build .
